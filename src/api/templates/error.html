<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="centered">
<main class="card">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if request_id %}<p class="muted small">Request id: <code>{{ request_id }}</code></p>{% endif %}
  <p><a href="/">Back to the dashboard</a></p>
</main>
</body>
</html>
